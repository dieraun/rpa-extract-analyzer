[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpa-loader-analyzer"
version = "2.0.0"
description = "Read-only Ren'Py loader.pyo and RPA archive research toolkit"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "uncompyle6==3.9.3",
    "xdis==6.1.7",
]

[project.scripts]
rpa-loader-analyzer = "src.cli:main"
rpa-loader-analyzer-gui = "src.gui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
